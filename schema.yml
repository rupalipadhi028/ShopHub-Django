openapi: 3.0.3
info:
  title: Shop Hub API
  version: 1.0.0
  description: REST API for the Shop Hub ecommerce storefront.
paths:
  /api/v1/auth/change-password/:
    post:
      operationId: v1_auth_change_password_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChange'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChange'
          description: ''
