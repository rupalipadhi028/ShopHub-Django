<!DOCTYPE html>
<html>
<head>
    <title>{{ product.name }} - Shop Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    
</head>



<body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
            🛍️ Shop Hub
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        Categories
                    </a>
                </li>

            </ul>

            <div>
                <a href="{% url 'cart' %}"
                   class="btn btn-outline-light me-2">
                    🛒 Cart
                </a>

                <a href="#"
                   class="btn btn-primary">
                    Login
                </a>
            </div>

        </div>
    </div>
</nav>

<div class="container py-5">

    <a href="/" class="btn btn-outline-secondary mb-4">
        ← Back to Home
    </a>

    <div class="card shadow">
        <div class="card-body">

            <div class="row">

                <!-- Product Image -->
                <div class="col-md-5 text-center">
                    {% if product.image %}
                        <img src="{{ product.image.url }}"
                             class="img-fluid rounded"
                             style="max-height: 400px;">
                    {% else %}
                        <div class="bg-secondary text-white p-5 rounded">
                            No Image
                        </div>
                    {% endif %}
                </div>

                <!-- Product Information -->
                <div class="col-md-7">

                    <h1 class="fw-bold">{{ product.name }}</h1>

                    <p class="text-muted">
                        {{ product.category.name }}
                    </p>

                    <h2 class="text-success">
                        ₹{{ product.price }}
                    </h2>

                    <p class="mt-4">
                        {{ product.description }}
                    </p>

                    <p>
                        <strong>Available Stock:</strong>
                        {{ product.stock }}
                    </p>

                    <form method="post" action="{% url 'add_to_cart' product.id %}">
                        {% csrf_token %}<button type="submit" class="btn btn-primary btn-lg" {% if product.stock == 0 %}disabled{% endif %}>
                            {% if product.stock == 0 %}Out of stock{% else %}🛒 Add to Cart{% endif %}
                        </button>
                    </form>

                </div>

            </div>

        </div>
    </div>

</div>

</body>
