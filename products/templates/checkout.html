{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - Shop Hub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
        }

        .checkout-container {
            max-width: 1100px;
            margin: 60px auto;
        }

        .checkout-card {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .checkout-title {
            font-weight: 700;
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: 600;
        }

        .place-order-btn {
            width: 100%;
            padding: 13px;
            border-radius: 50px;
            font-weight: 600;
        }

        .order-summary {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .total {
            border-top: 1px solid #ddd;
            padding-top: 15px;
            font-size: 20px;
            font-weight: 700;
        }
    </style>
</head>

<body>

<div class="container checkout-container">

    <div class="row g-4">

        <!-- CUSTOMER DETAILS -->

        <div class="col-lg-7">

            <div class="checkout-card">

                <h2 class="checkout-title">
                    🛍️ Checkout
                </h2>
<form method="POST">

    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label">
            Full Name
        </label>

        <input
            type="text"
            name="customer_name"
            class="form-control"
            placeholder="Enter your full name"
            required>
    </div>


    <div class="mb-3">
        <label class="form-label fw-bold">
            📱 Phone Number
        </label>

        <input
            type="tel"
            name="phone"
            class="form-control"
            placeholder="Enter your phone number"
            maxlength="15"
            required>
    </div>


    <div class="mb-3">
        <label class="form-label">
            Address
        </label>

        <textarea
            name="address"
            class="form-control"
            rows="3"
            placeholder="Enter your complete address"
            required></textarea>
    </div>


    <div class="row">

        <div class="col-md-6 mb-3">

            <label class="form-label">
                City
            </label>

            <input
                type="text"
                name="city"
                class="form-control"
                placeholder="Enter city"
                required>

        </div>


        <div class="col-md-6 mb-3">

            <label class="form-label">
                Pincode
            </label>

            <input
                type="text"
                name="pincode"
                class="form-control"
                placeholder="Enter pincode"
                required>

        </div>

    </div>


    <!-- PAYMENT METHOD -->
    <div class="mb-4">

        <label class="form-label fw-bold">
            💳 Payment Method
        </label>

        <div class="form-check">

            <input
                class="form-check-input"
                type="radio"
                name="payment_method"
                value="cod"
                checked>

            <label class="form-check-label">
                💵 Cash on Delivery
            </label>

        </div>


        <div class="form-check mt-2">

            <input
                class="form-check-input"
                type="radio"
                name="payment_method"
                value="online">

            <label class="form-check-label">
                💳 Online Payment
            </label>

        </div>

    </div>


    <!-- PLACE ORDER -->
    <button
        type="submit"
        class="btn btn-primary place-order-btn">

        🛒 Place Order

    </button>

</form>
                
       


        <!-- ORDER SUMMARY -->

        <div class="col-lg-5">

            <div class="checkout-card">

                <h4 class="checkout-title">
                    Order Summary
                </h4>

                <div class="order-summary">

                    {% for item in cart_items %}

                    <div class="summary-item">

                        <span>
                            {{ item.product.name }}
                            × {{ item.quantity }}
                        </span>

                        <strong>
                            ₹{{ item.subtotal }}
                        </strong>

                    </div>

                    {% endfor %}

                    <div class="summary-item total">

                        <span>
                            Total
                        </span>

                        <span>
                            ₹{{ total }}
                        </span>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
