<!DOCTYPE html>
<html>
<head>
    <title>All Products - Shop Hub</title>
</head>

<body>

<h1>All Products</h1>

{% for product in products %}

    <div>
        <h2>{{ product.name }}</h2>

        <p>{{ product.description }}</p>

        <p>₹{{ product.price }}</p>

        <a href="{% url 'product_detail' product.id %}">
            View Details
        </a>
    </div>

{% empty %}

    <p>No products available.</p>

{% endfor %}

</body>
</html>
